<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusTimer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:350px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 50px rgba(0,0,0,0.2);
    text-align:center;
    color:white;
}

h1{
    font-size:28px;
    margin-bottom:25px;
}

.timer-circle{
    width:220px;
    height:220px;
    margin:0 auto 30px;
    border-radius:50%;
    border:8px solid rgba(255,255,255,0.3);
    display:flex;
    justify-content:center;
    align-items:center;
}

.time{
    font-size:42px;
    font-weight:700;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

button{
    flex:1;
    margin:0 5px;
    padding:10px 0;
    border:none;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.start{background:#00f5a0;color:black;}
.pause{background:#ffd166;color:black;}
.reset{background:#ef476f;color:white;}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.quote{
    font-size:13px;
    opacity:0.9;
}

.set-time{
    margin-bottom:20px;
}

.set-time input{
    width:60%;
    padding:8px;
    border-radius:8px;
    border:none;
    outline:none;
}

.set-time button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#ffffff;
    font-weight:600;
}

.set-time{
    margin-bottom:20px;
    display:flex;
    gap:10px;
    justify-content:center;
}

.set-time input{
    width:80px;
    padding:8px;
    border-radius:8px;
    border:none;
    outline:none;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">
    <h1>FocusTimer</h1>

    <div class="timer-circle">
        <div class="time" id="time">25:00</div>
    </div>

    <div class="buttons">
        <button class="start" onclick="startTimer()">Start</button>
        <button class="pause" onclick="pauseTimer()">Pause</button>
        <button class="reset" onclick="resetTimer()">Reset</button>
    </div>

    <div class="quote">
        “Stay focused. Stay strong.”
    </div>
    <div class="set-time">
    <input type="number" id="minutesInput" placeholder="Enter minutes" min="1">
    <button onclick="setCustomTime()">Set</button>
</div>
<div class="set-time">
    <input type="number" id="minutesInput" placeholder="Minutes" min="0">
    <input type="number" id="secondsInput" placeholder="Seconds" min="0" max="59">
    <button onclick="setCustomTime()">Set</button>
</div>
</div>

<script>
let totalSeconds = 25 * 60;
let timerInterval = null;

const timeDisplay = document.getElementById("time");

function updateDisplay(){
    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;

    seconds = seconds < 10 ? "0" + seconds : seconds;
    timeDisplay.textContent = minutes + ":" + seconds;
}

function startTimer(){
    if(timerInterval) return;

    timerInterval = setInterval(() => {
        if(totalSeconds > 0){
            totalSeconds--;
            updateDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;
            alert("Time is up! 🔥");
        }
    },1000);
}

function pauseTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
    totalSeconds = 25 * 60;
    updateDisplay();
}

updateDisplay();

function setCustomTime(){
    let inputMinutes = document.getElementById("minutesInput").value;

    if(inputMinutes > 0){
        clearInterval(timerInterval);
        timerInterval = null;
        totalSeconds = inputMinutes * 60;
        updateDisplay();
    }
}

function resetTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
    totalSeconds = 0;
    document.getElementById("minutesInput").value = "";
    updateDisplay();
}

function setCustomTime(){
    let minutes = parseInt(document.getElementById("minutesInput").value) || 0;
    let seconds = parseInt(document.getElementById("secondsInput").value) || 0;

    if(seconds > 59){
        alert("Seconds must be less than 60");
        return;
    }

    clearInterval(timerInterval);
    timerInterval = null;

    totalSeconds = (minutes * 60) + seconds;

    updateDisplay();
}
</script>

</body>
</html>
